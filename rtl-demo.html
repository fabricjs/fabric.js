<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <title>Fabric RTL cursor demo</title>
    <style>
      body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
      #info { margin-top: 12px; font-size: 14px; color: #333; }
      #cursor-pos { font-weight: bold; color: #0070f3; }
    </style>
  </head>
  <body>
    <h2>RTL cursor positioning fix — local demo</h2>
    <p>Double-click the Hebrew text to enter editing mode, then single-click anywhere inside it.<br>
       The cursor should land on the character you clicked, not always jump to position 0.</p>
    <canvas id="c" width="600" height="200"></canvas>
    <div id="info">Click inside the text while editing — cursor position: <span id="cursor-pos">—</span></div>

    <script type="module">
      import { Canvas, Textbox } from './dist/index.mjs';

      const canvas = new Canvas('c', {
        enableRetinaScaling: false,
        backgroundColor: '#ffffff',
      });

      const rtlText = new Textbox('שלום עולם, זה טקסט בעברית', {
        direction: 'rtl',
        textAlign: 'right',
        left: 50,
        top: 60,
        width: 500,
        fontSize: 32,
        fontFamily: 'Arial',
        fill: '#000000',
      });

      canvas.add(rtlText);
      canvas.renderAll();

      const info = document.getElementById('cursor-pos');
      rtlText.on('selection:changed', () => {
        info.textContent = `selectionStart = ${rtlText.selectionStart}`;
      });
    </script>
  </body>
</html>
