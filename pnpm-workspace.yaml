packages:
  - packages/*

savePrefix: ''

overrides:
  # Expressive Code still uses postcss-nested 6, which requests the vulnerable parser 6.
  'postcss-nested@6>postcss-selector-parser': 7.1.6

catalog:
  '@playwright/test': 1.63.0
  '@types/jsdom': 30.0.0
  '@types/node': 24.13.6
  '@typescript/native': npm:typescript@7.0.2
  canvas: 3.2.3
  jsdom: 30.1.2
  typedoc: 0.28.20
  # TypeDoc and Astro still need the TypeScript 6 compiler API.
  typescript: npm:@typescript/typescript6@6.0.2
  westures: 1.1.1
