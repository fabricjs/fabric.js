name: 'Resolve labeled PR changelog conflicts'

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-conflict-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event.label.name == 'resolve-changelog' &&
      github.event.sender.type == 'User' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout resolver from master
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Merge master with union for the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_BY: ${{ github.event.sender.login }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/resolve-changelog-conflict.sh
