name: 'Comment build stats on PR'
on:
  workflow_run:
    workflows: ['🩺']
    types:
      - completed
permissions:
  actions: read
  contents: read
jobs:
  build-stats:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    if: >-
      ${{
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.event == 'pull_request'
      }}
    env:
      unique_id: <!-- build-stats -->
    name: Build stats
    runs-on: ubuntu-24.04
    steps:
      - name: Find report artifacts
        id: artifacts
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            });
            const names = new Set(artifacts.filter(({ expired }) => !expired).map(({ name }) => name));
            core.setOutput('available', ['prstats', 'prnumber'].every(name => names.has(name)));
      - name: 'Create an empty tmp directory'
        if: steps.artifacts.outputs.available == 'true'
        run: mkdir ${{ runner.temp }}/artifacts
      - name: Checkout
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install dependencies
        if: steps.artifacts.outputs.available == 'true'
        uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
          install-system-deps: false
      - name: Build fabric.js
        if: steps.artifacts.outputs.available == 'true'
        run: npm run build
      - name: Recover build stats
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prstats
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/artifacts
      - name: Put stats in GITHUB_OUTPUT
        if: steps.artifacts.outputs.available == 'true'
        id: pr_stats
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const stats = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'artifacts/prstats.txt'), 'utf8'));
            core.setOutput('pr_stats', JSON.stringify(stats));
      - name: Recover pr number
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prnumber
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/artifacts
      - name: Add pr number to output
        if: steps.artifacts.outputs.available == 'true'
        id: prnumber
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const number = Number(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'artifacts/prnumber.txt'), 'utf8').trim());
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid PR number');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const run = context.payload.workflow_run;
            if (pr.head.sha !== run.head_sha || pr.head.repo.full_name !== run.head_repository.full_name) {
              throw new Error('PR does not match the triggering run');
            }
            core.setOutput('pr_number', number);
      - name: Create upstream stats
        if: steps.artifacts.outputs.available == 'true'
        id: upstream_stats
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          result-encoding: string
          script: |
            const { buildStats } = await import('${{ github.workspace }}/scripts/buildStats.mjs');
            return JSON.stringify({
              size: buildStats(),
            });
      - name: process
        if: steps.artifacts.outputs.available == 'true'
        id: stats-message
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        env:
          pr_stats: ${{ steps.pr_stats.outputs.pr_stats }}
          upstream_stats: ${{ steps.upstream_stats.outputs.result }}
        with:
          result-encoding: string
          script: |
            const { run_simple } = await import('${{ github.workspace }}/scripts/buildStats.mjs');
            return await run_simple({
              modified: JSON.parse(process.env.pr_stats),
              original: JSON.parse(process.env.upstream_stats),
            });
      - name: Comment on PR for build stats
        if: steps.artifacts.outputs.available == 'true'
        uses: ./.github/actions/find-create-or-update-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.prnumber.outputs.pr_number }}
          body-includes: '${{ env.unique_id }}'
          comment-author: 'github-actions[bot]'
          body: |
            ${{ env.unique_id }}
            ${{ steps.stats-message.outputs.result }}
          edit-mode: replace
