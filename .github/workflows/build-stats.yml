name: 'Comment build stats on PR'
on:
  workflow_run:
    workflows: ['🩺']
    types: [completed]
permissions: {}
jobs:
  baseline:
    name: Build trusted baseline
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.target.outputs.ready }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve pull request and statistics
        id: target
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { resolveRun, artifact } = require('./.github/scripts/workflow-reports.cjs');
            const target = await resolveRun({ github, context, workflow: 'build.yml' });
            if (!target?.pr) return;
            core.setOutput('ready', Boolean(await artifact({ github, context, run: target.run, name: 'prstats' })));
      - name: Install baseline dependencies
        if: steps.target.outputs.ready == 'true'
        uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
          install-system-deps: false
      - name: Build baseline
        if: steps.target.outputs.ready == 'true'
        run: pnpm run build
      - name: Collect baseline statistics
        if: steps.target.outputs.ready == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { buildStats } from './scripts/buildStats.mjs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/baseline.json`, JSON.stringify({ size: buildStats() }));
          JS
      - name: Upload baseline statistics
        if: steps.target.outputs.ready == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: baseline-stats-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline.json
          retention-days: 1
  report:
    name: Build stats
    needs: baseline
    if: needs.baseline.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download baseline statistics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-stats-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline
      - name: Download PR statistics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prstats
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prstats
      - name: Comment on the validated PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { resolveRun, readReport, buildStatsReport, comment } = require('./.github/scripts/workflow-reports.cjs');
            const target = await resolveRun({ github, context, workflow: 'build.yml' });
            if (!target?.pr) return;
            const original = JSON.parse(readReport(`${process.env.RUNNER_TEMP}/baseline/baseline.json`, 100000));
            const modified = JSON.parse(readReport(`${process.env.RUNNER_TEMP}/prstats/prstats.txt`, 100000));
            await comment({ github, context, pr: target.pr, marker: '<!-- build-stats -->', body: buildStatsReport(original, modified) });
