name: '🩺'

on:
  pull_request:
    branches: [master]
    paths-ignore: [CHANGELOG.md]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cached-install
        id: deps
        with:
          node-version: 24.x
      - name: Format check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm run prettier:check
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm exec eslint extensions packages
      - name: Type check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm run typecheck
      - name: Workflow helper tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test .github/scripts/*.test.cjs
  build:
    name: Packages and website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
          install-system-deps: true
      - name: Build fabric.js
        id: build
        run: pnpm run build
      - name: Create prnumber artifact
        run: echo "${{ github.event.pull_request.number }}" >> ./prnumber.txt
      - name: Upload Pr Number
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: prnumber
          path: ./prnumber.txt
      - name: Prepare pr stats
        id: stats
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          result-encoding: string
          script: |
            const { buildStats } = await import('${{ github.workspace }}/scripts/buildStats.mjs');
            const size = buildStats();
            return JSON.stringify({
              // Keep the default-branch build-stats workflow compatible while
              // this PR's workflow artifact uses the new package metrics.
              size: Object.fromEntries(
                Object.entries(size).map(([name, stats]) => [
                  name,
                  {
                    ...stats,
                    bundled: stats.generated || 0,
                    minified: stats.minified || 0,
                  },
                ]),
              ),
            });
      - name: Create the artifact for stats
        env:
          PR_STATS: ${{ steps.stats.outputs.result }}
        run: printf '%s\n' "$PR_STATS" > ./prstats.txt
      - name: Upload Pr stats
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: prstats
          path: ./prstats.txt
      - name: Smoke test packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run smoke:packages
      - name: Build website
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir packages/website run build
