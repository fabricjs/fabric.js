name: '🧪'
on:
  push:
    branches: [master]
    paths-ignore: [CHANGELOG.md]
  pull_request:
    branches: [master]
    paths-ignore: [CHANGELOG.md]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
          install-system-deps: true
      - name: Build fabric.js
        run: pnpm run build:fast
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: xvfb-run pnpm run test:e2e
      - name: Upload Test Output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && failure() }}
        with:
          name: e2e-report
          path: ./packages/e2e/test-report/
          include-hidden-files: true
  vitest-node:
    name: Vitest tests Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cached-install
        with:
          node-version: ${{ matrix.node }}.x
          install-system-deps: true
      - name: Run Vitest unit test
        if: matrix.node != 24
        run: pnpm run test:vitest
      - name: Run Vitest with coverage
        if: matrix.node == 24
        run: pnpm run test:vitest:coverage
      - name: Record tested revision
        if: ${{ !cancelled() && matrix.node == 24 && hashFiles('.nyc_output/lcov.info') != '' }}
        run: git rev-parse HEAD > .nyc_output/revision.txt
      - name: Upload test coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && matrix.node == 24 && hashFiles('.nyc_output/coverage-summary.txt') != '' }}
        with:
          name: coverage-vitest
          path: ./.nyc_output/coverage-summary.txt
          include-hidden-files: true
      - name: Upload Sonarqube coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() && matrix.node == 24 && hashFiles('.nyc_output/lcov.info') != '' }}
        with:
          name: coverage-vitest-sonarqube
          path: |
            ./.nyc_output/lcov.info
            ./.nyc_output/revision.txt
          include-hidden-files: true
  vitest-browser:
    name: Vitest browser tests
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: true
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
          install-system-deps: false
      - name: Install Playwright browsers
        id: browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Run Chromium unit tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: xvfb-run pnpm run test:vitest:chromium
      - name: Run Firefox unit tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: xvfb-run pnpm run test:vitest:firefox
