name: 'Comment coverage on PR'
on:
  workflow_run:
    workflows: ['🧪']
    types:
      - completed
permissions:
  actions: read
  contents: read
jobs:
  coverage:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    if: >-
      ${{
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0] != null &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    env:
      unique_id: <!-- coverage-report -->
    name: Coverage reporting
    runs-on: ubuntu-24.04
    steps:
      - name: Find report artifacts
        id: artifacts
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            });
            const names = new Set(artifacts.filter(({ expired }) => !expired).map(({ name }) => name));
            core.setOutput('available', ['coverage-vitest'].every(name => names.has(name)));
      - name: Checkout actions
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.artifacts.outputs.available == 'true'
        with:
          name: coverage-vitest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/artifacts
      - name: Build the report
        if: steps.artifacts.outputs.available == 'true'
        id: report
        run: |
          echo "\`\`\`" > ./cov.txt
          cat ${{ runner.temp }}/artifacts/coverage-summary.txt >> ./cov.txt
          echo "\`\`\`" >> ./cov.txt
          echo "${{ env.unique_id }}" >> ./cov.txt
      - name: Comment on PR for coverage
        if: steps.artifacts.outputs.available == 'true'
        uses: ./.github/actions/find-create-or-update-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          body-includes: '${{ env.unique_id }}'
          comment-author: 'github-actions[bot]'
          body-path: ./cov.txt
          edit-mode: replace
