name: 'Update CHANGELOG.md file'
on:
  workflow_run:
    workflows: ['Check and create Changelog 📋']
    types:
      - completed
permissions:
  contents: read
jobs:
  update_changelog:
    permissions:
      actions: read
      contents: write
      pull-requests: read
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Update changelog through GitHub API
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { updateChangelog } = require('./.github/scripts/update-changelog.cjs');
            await updateChangelog({ github, context });
