name: 'Update CHANGELOG.md file'
on:
  workflow_run:
    workflows: ['Check and create Changelog 📋']
    types: [completed]
permissions: {}
jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.target.outputs.kind }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve changelog target
        id: target
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { resolveRun, artifact } = require('./.github/scripts/workflow-reports.cjs');
            const target = await resolveRun({ github, context, workflow: 'changelog_check_and_create.yml', branches: ['master', '6.x'] });
            if (!target?.pr || !await artifact({ github, context, run: target.run, name: 'changelog_artifact' })) return;
            core.setOutput('kind', target.pr.head.repo.full_name === target.pr.base.repo.full_name ? 'internal' : 'fork');
  update_changelog:
    needs: resolve
    if: needs.resolve.outputs.kind == 'internal'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update the same-repository changelog
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { updateChangelog } = require('./.github/scripts/update-changelog.cjs');
            await updateChangelog({ github, context });
  fork_help:
    needs: resolve
    if: needs.resolve.outputs.kind == 'fork'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Help the fork author update the changelog
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const { updateChangelog } = require('./.github/scripts/update-changelog.cjs');
            await updateChangelog({ github, context });
