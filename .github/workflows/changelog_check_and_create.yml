name: 'Check and create Changelog 📋'
on:
  pull_request:
    branches: [master, 6.x]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  changelog-creation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check CHANGELOG.md
        id: check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v6.4.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const renamed = Boolean(context.payload.changes?.title);
            core.setOutput('needs-update', renamed || !files.some(file => file.filename === 'CHANGELOG.md'));
      # Only a signal: the privileged updater obtains all metadata from GitHub.
      - name: Create changelog signal
        if: steps.check.outputs.needs-update == 'true'
        run: printf '{}\n' > changelog_artifact.txt
      - name: Upload changelog signal
        if: steps.check.outputs.needs-update == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: changelog_artifact
          path: changelog_artifact.txt
      - name: Require a changelog entry
        if: steps.check.outputs.needs-update == 'true'
        run: exit 1
