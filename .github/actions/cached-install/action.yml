name: 'Install fabric'
description: 'Install dependencies from cache between different node versions'
inputs:
  node-version:
    required: true
    description: 'the node version'
  install-system-deps:
    description: 'Install system dependencies for compiling node-canvas from source'
    default: 'false'
runs:
  using: 'composite'
  steps:
    # Ubuntu x64 uses prebuilt canvas binaries; opt in only for source builds.
    - name: Install system deps for node canvas
      if: inputs.install-system-deps == 'true'
      run: sudo apt-get update && sudo apt-get install --yes libgif-dev libpng-dev libpango1.0-dev libjpeg-dev librsvg2-dev libcairo2-dev
      shell: bash
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.29.1
    - name: Use Node.js v${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
